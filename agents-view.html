<!doctype html><html><head><meta charset="utf-8"><style>
:root {
  color-scheme: light dark;
  --gold: #d4a017;
  --gold-bg: #3b2a07;
  --gold-fg: #ffe08a;
}
.ic {
  display: block;
  flex: none;
}
.tg b,
#tb button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
#bn[data-m="n"]::after {
  content: "✓";
  margin-left: 2px;
}
#bn[data-m="o"]::after {
  content: "·";
  margin-left: 2px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: transparent;
  font:
    12px system-ui,
    sans-serif;
  color: var(--foreground, #222);
}
#app {
  display: flex;
  height: 100vh;
  min-height: 0;
  border: 1px solid var(--border, #ddd);
  border-radius: 14px;
  overflow: hidden;
  background: var(--card, #fff);
}
.pn {
  width: 236px;
  flex: none;
  overflow: auto;
  padding: 10px;
  background: var(--card, #fff);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
#lp {
  border-right: 1px solid var(--border, #ddd);
}
#rp {
  border-left: 1px solid var(--border, #ddd);
  width: 260px;
}
.pn h3 {
  margin: 2px 0 0;
  font-size: 13px;
}
.gh {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 2px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted-foreground, #777);
}
.gh i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 9px;
  cursor: pointer;
  border: 1px solid transparent;
}
.row:hover {
  background: var(--fill-1, rgba(128, 128, 128, 0.12));
}
.row.sel {
  border-color: var(--primary, var(--gold));
  background: var(--fill-1, rgba(128, 128, 128, 0.12));
}
.row img {
  width: 30px;
  height: 30px;
  image-rendering: pixelated;
  border-radius: 8px;
  background: var(--sunken, rgba(128, 128, 128, 0.15));
  flex: none;
}
.row .n {
  font-weight: 600;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .s {
  font-size: 12px;
  color: var(--muted-foreground, #777);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.row .tx {
  min-width: 0;
  flex: 1;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: none;
  background: #94a3b8;
}
.st-running {
  background: #3b82f6;
}
.st-waiting {
  background: #f59e0b;
}
.st-failed {
  background: #ef4444;
}
.st-unread {
  background: #10b981;
}
.st-off {
  background: #64748b;
}
.st-idle {
  background: #94a3b8;
}
#mid {
  position: relative;
  flex: 1;
  min-width: 0;
  background: #dbe7ee;
}
#cv {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: pan-y;
}
#cv:active {
  cursor: grabbing;
}
#labs {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.lab {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  will-change: transform;
}
.lab .p {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(22, 27, 36, 0.88);
  color: #fff;
  padding: 2px 8px 2px 6px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(255, 255, 255, 0.14);
}
.lab .p i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.lab .q {
  background: rgba(255, 255, 255, 0.95);
  color: #1f2937;
  padding: 1px 7px;
  border-radius: 7px;
  font-size: 11px;
  max-width: 190px;
  overflow: hidden;
  text-overflow: ellipsis;
  border: 1px solid #10b981;
}
.lab.l0 .p {
  padding: 3px;
  gap: 0;
}
.lab.l0 .p i {
  width: 10px;
  height: 10px;
}
.lab.l0 .p span,
.lab.l0 .q,
.lab.l1 .q {
  display: none;
}
.lab.c.cs .tx {
  display: none;
}
.lab.c.cs .q {
  padding: 1px 5px;
}
.lab.sel .p {
  outline: 2px solid #fbbf24;
}
.zl {
  position: absolute;
  left: 0;
  top: 0;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: #3d4a5c;
  background: rgba(255, 255, 255, 0.82);
  padding: 2px 9px;
  border-radius: 99px;
  border: 1px solid rgba(0, 0, 0, 0.12);
  will-change: transform;
}
#top {
  position: absolute;
  left: 50%;
  top: 10px;
  transform: translateX(-50%);
  background: rgba(22, 27, 36, 0.9);
  color: #fff;
  border-radius: 99px;
  padding: 5px 14px;
  font-weight: 600;
  font-size: 12px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  white-space: nowrap;
}
#top b {
  color: #fbbf24;
}
#tb {
  position: absolute;
  left: 50%;
  bottom: 12px;
  transform: translateX(-50%);
  display: flex;
  gap: 4px;
  align-items: center;
  background: rgba(22, 27, 36, 0.92);
  padding: 5px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, 0.14);
}
#tb button {
  background: transparent;
  border: 0;
  color: #e5e7eb;
  font: 600 12px system-ui;
  padding: 6px 10px;
  border-radius: 9px;
  cursor: pointer;
}
#tb button:hover {
  background: rgba(255, 255, 255, 0.12);
}
#tb .gold {
  background: var(--gold-bg);
  color: var(--gold-fg);
  border: 1px solid var(--gold);
}
#tb span {
  color: #cbd5e1;
  min-width: 42px;
  text-align: center;
  font-size: 12px;
}
#card {
  position: absolute;
  right: 10px;
  top: 46px;
  width: 250px;
  max-height: 60%;
  overflow: auto;
  background: var(--card, #fff);
  border: 1px solid var(--border, #ddd);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  display: none;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
}
#card h4 {
  margin: 0 0 4px;
  font-size: 13px;
}
#card .t {
  opacity: 0.8;
  margin: 4px 0;
}
#card button {
  background: var(--fill-1, rgba(128, 128, 128, 0.12));
  border: 1px solid var(--border, #ccc);
  border-radius: 8px;
  padding: 3px 9px;
  color: inherit;
  font: 600 11px system-ui;
  cursor: pointer;
  margin: 4px 5px 0 0;
}
.tabs {
  display: flex;
  gap: 4px;
}
.tabs button {
  flex: 1;
  background: transparent;
  border: 1px solid var(--border, #ccc);
  border-radius: 9px;
  padding: 4px;
  color: inherit;
  font: 600 11px system-ui;
  cursor: pointer;
}
.tabs button.on {
  background: var(--fill-1, rgba(128, 128, 128, 0.15));
  border-color: var(--primary, var(--gold));
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}
.stats div {
  background: var(--sunken, rgba(128, 128, 128, 0.12));
  border-radius: 9px;
  padding: 5px;
  text-align: center;
  font-size: 11px;
  color: var(--muted-foreground, #777);
}
.stats b {
  display: block;
  font-size: 15px;
  color: var(--foreground, #222);
}
.fi {
  padding: 7px 8px;
  border-radius: 9px;
  border: 1px solid var(--border, #ddd);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.fi:hover {
  background: var(--fill-1, rgba(128, 128, 128, 0.12));
}
.fi.warn {
  border-color: #f59e0b;
  background: rgba(245, 158, 11, 0.1);
}
.fi.bad {
  border-color: #ef4444;
  background: rgba(239, 68, 68, 0.08);
}
.fi .h {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-weight: 700;
  font-size: 12px;
}
.fi .h span {
  font-weight: 500;
  color: var(--muted-foreground, #777);
  font-size: 12px;
}
.fi .b {
  font-size: 12px;
  color: var(--muted-foreground, #777);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}
.zl:empty {
  display: none;
}
.row:focus-visible,
.fi:focus-visible,
#tb button:focus-visible {
  outline: 2px solid var(--primary, var(--gold));
  outline-offset: 1px;
}
.empty {
  color: var(--muted-foreground, #777);
  padding: 8px;
}
#app {
  position: relative;
}
.pn.hid {
  display: none;
}
#app.ov .pn {
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 6;
  box-shadow: 0 0 30px rgba(0, 0, 0, 0.35);
}
#app.ov .pn {
  padding-top: 56px;
}
#app.ov #lp {
  left: 0;
}
#app.ov #rp {
  right: 0;
}
#tb button {
  white-space: nowrap;
}
#bk {
  position: absolute;
  inset: 0;
  z-index: 5;
  background: rgba(0, 0, 0, 0.35);
}
#bk[hidden],
#bx[hidden] {
  display: none;
}
#bx {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 7;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(22, 27, 36, 0.92);
  color: #fff;
  font: 700 16px system-ui;
  cursor: pointer;
}

#card button.on {
  background: var(--gold-bg);
  border-color: var(--gold);
  color: var(--gold-fg);
}
.tg {
  position: absolute;
  top: 8px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(22, 27, 36, 0.92);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 99px;
  padding: 0 13px;
  height: 40px;
  font: 600 12px system-ui;
  cursor: pointer;
  touch-action: manipulation;
}
#tl {
  left: 8px;
}
#tr {
  right: 8px;
}
.tg b {
  font-size: 15px;
  font-weight: 400;
}
.tg.on {
  background: var(--gold-bg);
  border-color: var(--gold);
  color: var(--gold-fg);
}
@media (max-width: 560px) {
  .tg span {
    display: none;
  }
  .tg {
    width: 40px;
    padding: 0;
    justify-content: center;
  }
}

@media (max-width: 560px) {
  #app {
    border-radius: 10px;
    border-left: 0;
    border-right: 0;
  }
  #top {
    top: 8px;
    font-size: 12px;
    padding: 5px 11px;
    max-width: calc(100% - 16px);
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #tb {
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 12px);
    gap: 2px;
    padding: 4px;
  }
  #tb button {
    padding: 9px 8px;
    min-height: 40px;
    min-width: 36px;
    font-size: 13px;
  }
  #tb span {
    display: none;
  }
  #tb .gold {
    font-size: 12px;
    padding: 9px 10px;
  }
  #app.ov .pn {
    width: min(88%, 340px);
  }
  #card {
    left: 10px;
    right: 10px;
    width: auto;
    top: auto;
    bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    max-height: 46%;
    font-size: 13px;
  }
  #card button {
    padding: 8px 12px;
    font-size: 12.5px;
  }
  .row {
    padding: 9px 8px;
  }
  .row img {
    width: 36px;
    height: 36px;
  }
  .row .n {
    font-size: 13.5px;
  }
  .row .s {
    font-size: 12px;
  }
  .fi {
    padding: 10px;
  }
  .fi .h {
    font-size: 12.5px;
  }
  .fi .b {
    font-size: 12px;
  }
  .tabs button {
    padding: 9px;
    font-size: 12.5px;
  }
  .lab .p {
    font-size: 12px;
  }
  .zl {
    font-size: 12px;
    padding: 3px 9px;
  }
}
@media (max-width: 400px) {
  #tb button:nth-child(2) {
    display: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto;
  }
}
#tb [hidden]{display:none!important}
